name: 💡 Sugerir uma melhoria
description: Uma ideia para deixar o Ipasty melhor.
labels: ["melhoria"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Qual problema isso resolve?
      placeholder: "Eu sempre preciso… e hoje é difícil porque…"
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Como você imagina que funcionaria?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternativas que você considerou
  - type: checkboxes
    id: help
    attributes:
      label: Contribuição
      options:
        - label: Eu gostaria de ajudar a implementar isso
