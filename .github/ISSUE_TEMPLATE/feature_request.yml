name: 💡 Feature request
description: An idea to make Ipasty better.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      placeholder: "I often need to… and today it's hard because…"
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How would it work?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: checkboxes
    id: help
    attributes:
      label: Contributing
      options:
        - label: I'd like to help implement this
