name: 🐛 Bug report
description: Something doesn't work as it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Ipasty! ⚠️ **Don't paste your clipboard history, API keys or personal data here.**
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Describe the problem and what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Ipasty with ⇧⌘V
        2. Go to the … tab
        3. Click …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Ipasty version
      description: Shown at the bottom of Ipasty Settings (menu bar icon → Settings…).
      placeholder: "1.1.0"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac model
      placeholder: "macOS 15.2, MacBook Air M2"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How did you install it?
      options:
        - Downloaded from the Releases page
        - Built with ./build.sh
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or extra information
      description: Drag images here if it helps.
