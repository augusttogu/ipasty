name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Publish release
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Check version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          FILE="$(cat VERSION)"
          if [ "$TAG" != "$FILE" ]; then
            echo "Tag v$TAG does not match the VERSION file ($FILE)."; exit 1
          fi
          echo "VERSION=$FILE" >> "$GITHUB_ENV"

      - name: Build universal app
        run: ./build.sh --zip

      - name: Release notes
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { on=1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          cat >> notes.md <<'EOF'

          ---
          ### How to install on your Mac
          1. Download **Ipasty-*.zip** below, open it and drag the app into **Applications**.
          2. First launch: **System Settings → Privacy & Security → Open Anyway**.
          3. Allow **Accessibility** so a click pastes directly (asked only once; it survives updates).

          Full guide: [docs/INSTALL.md](https://github.com/${{ github.repository }}/blob/main/docs/INSTALL.md)
          EOF
          shasum -a 256 dist/*.zip | tee dist/SHA256SUMS.txt

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/SHA256SUMS.txt \
            --title "Ipasty $VERSION" \
            --notes-file notes.md
